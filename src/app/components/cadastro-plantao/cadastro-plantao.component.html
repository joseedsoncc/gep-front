<div class="row justify-content-center fade-in">
  <div class="col-md-8 col-lg-6">
    <div class="card">
      <div class="card-header bg-success text-white">
        <h3 class="mb-0">
          <i class="bi bi-calendar-plus-fill me-2"></i>
          Cadastrar Plantão
        </h3>
      </div>
      <div class="card-body">
        <form [formGroup]="plantaoForm" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label class="form-label">
              <i class="bi bi-person-badge me-1"></i>
              Profissional
            </label>
            <select class="form-select" formControlName="profissionalId">
              <option value="">Selecione o profissional</option>
              <option *ngFor="let prof of profissionais" [value]="prof.id">
                {{ prof.nome }} - {{ categoriaLabel[prof.categoria] }} ({{
                  prof.cargaHorariaSemanal
                }}h)
              </option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">
              <i class="bi bi-calendar-date me-1"></i>
              Data
            </label>
            <input type="date" class="form-control" formControlName="data" />
          </div>

          <div class="mb-4">
            <label class="form-label">
              <i class="bi bi-clock me-1"></i>
              Turno
            </label>
            <select class="form-select" formControlName="turno">
              <option value="">Selecione o turno</option>
              <option *ngFor="let turno of turnos" [value]="turno">
                {{ turnoHorario[turno].label }} -
                {{ turnoHorario[turno].horario }} ({{
                  turnoHorario[turno].horas
                }}h)
              </option>
            </select>
          </div>

          <div class="d-flex gap-2">
            <button
              type="submit"
              class="btn btn-success flex-grow-1"
              [disabled]="plantaoForm.invalid || loading"
            >
              <span *ngIf="!loading">
                <i class="bi bi-save me-2"></i>
                Cadastrar
              </span>
              <span *ngIf="loading">
                <span
                  class="spinner-border spinner-border-sm me-2"
                  role="status"
                ></span>
                Cadastrando...
              </span>
            </button>
            <button
              type="button"
              class="btn btn-secondary"
              (click)="cancelar()"
            >
              <i class="bi bi-arrow-left me-2"></i>
              Cancelar
            </button>
          </div>
        </form>

        <div *ngIf="mensagemSucesso" class="alert alert-success mt-3 fade-in">
          <i class="bi bi-check-circle-fill me-2"></i>
          {{ mensagemSucesso }}
        </div>
        <div *ngIf="mensagemErro" class="alert alert-danger mt-3 fade-in">
          <i class="bi bi-exclamation-triangle-fill me-2"></i>
          {{ mensagemErro }}
        </div>
      </div>
    </div>
  </div>
</div>
